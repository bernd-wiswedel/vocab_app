[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that may take longer to run
    browser: Tests that drive a real browser (skipped without Playwright and Chrome)
    sheets: Contract tests against the real Google Sheets API (run by hand, skipped without credentials)
