name: Tests

on:
  push:
    branches: [ main, tests ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest -v -m "not slow and not browser" --tb=short

    - name: Run tests with coverage
      run: |
        pytest --cov=level --cov=google_sheet_io --cov=app --cov-report=term --cov-report=xml -m "not slow and not browser"

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      if: always()
      continue-on-error: true
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  browser:
    # The test round runs in the browser, so this is the only job that covers
    # asking, revealing, skipping, switching and grading. It needs no secrets:
    # the Google Sheets boundary is faked inside the tests.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Chromium
      run: python -m playwright install --with-deps chromium

    - name: Run browser tests
      run: |
        pytest -v -m browser --tb=short
