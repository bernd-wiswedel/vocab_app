# Learners of WortSpaß — one section per child.
#
# The section name after "user:" is what the login page shows and what names
# the score tabs in that learner's spreadsheet: "Scores Latein (<Name>)" and
# "Scores Englisch (<Name>)". The spreadsheet has to be a copy of the template
# (tabs Latein, Englisch and the two score tabs) and the service account
# (keys/ or GOOGLE_SERVICE_ACCOUNT_JSON) needs edit access to it.
#
# spreadsheet_id is the ID from the URL: docs.google.com/spreadsheets/d/<ID>/edit
#
# Passwords are NOT in this file. Each learner's password comes from the
# environment variable LOGIN_PASSWORD_<NAME> (upper-cased), e.g.
# LOGIN_PASSWORD_JAKOB. A learner without one can only be browsed as a guest.
# (A "password =" key is honoured too, but keep it out of the committed file.)
#
# For a deployment or the tests, the VOCAB_APP_CONFIG environment variable may
# hold INI text in this same format; when it is set, this file is ignored.

[user:Jakob]
    spreadsheet_id = 1jTv5qPBcGCTcGFqnj9mnQvEwfjsf4YtQnA5GTJbU-Ig

